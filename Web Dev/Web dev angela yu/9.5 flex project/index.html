<!DOCTYPE html>
<html>
  <head>
    <title>Flexbox Pricing Table</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Sono", sans-serif;
      }
      .pricing-container{
        display:flex;
        gap: 20px;
        justify-content: space-between;
        align-items: center;
        height: 100vh;
        text-align: center;
      }
      .pricing-plan{
        flex:1;
        background-color: #f2f2f2;
        height: 270px;
        max-width: 368px;
        padding: 20px;
      }
      .plan-price{
        font-size: 3rem;
        font-weight: bolder;
      }
      .plan-title{
        font-size:1.3rem;
        font-weight: bold;
      }
      li{
        list-style-type: none;
        display: inline-block;
        padding: 7px;
      }
      .plan-button{
        background-color: hsl(24, 100%, 50%);
        color: #fff;
        border-radius: 5px;
        border: 0 ;
        padding: 10px;
      }

      /* Hint: What can you do with a media query and flexbox? */
      @media (max-width: 1250px) {
        .pricing-container{
          flex-direction: column;
          height: 100%;
        }
      }
    </style>
  </head>

  <body>
    <div className="pricing-container">
      <div className="pricing-plan">
        <div className="plan-title">Basic</div><br>
        <div className="plan-price">$11.99/month</div>
        <ul className="plan-features">
          <li>✅ 10GB Storage</li><br>
          <li>✅ 1 User</li><br>
          <li>🚫 Support</li>
        </ul>
        <button className="plan-button">Sign Up</button>
      </div>
      <div className="pricing-plan">
        <div className="plan-title">Standard</div><br>
        <div className="plan-price">$19.99/month</div>
        <ul className="plan-features">
          <li>✅ 50GB Storage</li><br>
          <li>✅ 5 Users</li><br>
          <li>✅ Phone &amp; Email Support</li>
        </ul>
        <button className="plan-button">Sign Up</button>
      </div>
      <div className="pricing-plan">
        <div className="plan-title">Premium</div><br>
        <div className="plan-price">$49.99/month</div>
        <ul className="plan-features">
          <li>✅ 100GB Storage</li><br>
          <li>✅ 10 Users</li><br>
          <li>✅ 24/7 Support</li>
        </ul>
        <button className="plan-button">Sign Up</button>
      </div>
    </div>
  </body>
</html>
